name: Validate worker (no AI)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q scripts
      - run: bash -n scripts/install_private_bounty_inbox.sh

      - run: bash -n scripts/install_bounty_autocoder.sh
      - run: bash -n scripts/upgrade_bounty_filters.sh
