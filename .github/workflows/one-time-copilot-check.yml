name: One-time Copilot CLI authentication check
# Only a push to the exact branch below can trigger this job.
# This workflow makes ONE fixed Copilot request, with no external issue text.
on:
  push:
    branches:
      - verify-copilot-pat-once
    paths:
      - smoke-trigger.txt
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install official Copilot CLI
        run: npm install --global @github/copilot
      - name: One minimal fixed prompt using COPILOT_PAT
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          copilot -p 'Reply with exactly the word READY. Do not open files, use tools, or make changes.' \
            --max-ai-credits=2 --no-ask-user --disable-builtin-mcps --available-tools='view' -s
